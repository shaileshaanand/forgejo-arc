name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: git.shailesh.live
  IMAGE_NAME: shailesh/forgejo-arc
  CHART_REPOSITORY: shailesh/charts

jobs:
  checks:
    name: Tests and lint
    runs-on: debian-large
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: https://github.com/actions/setup-go@v5
        with:
          go-version: '1.25.8'
          # GitHub's cache service is not available on Forgejo.
          cache: false

      - name: Set up Helm
        uses: https://github.com/Azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Check formatting
        run: make lint

      - name: Run race-enabled tests and vet
        run: make test

      - name: Lint and render Helm chart
        run: make chart

      - name: Check generated CRDs and deepcopy code
        run: |
          make generate
          git diff --exit-code -- api config/crd charts/forgejo-arc/crds

  build-and-publish:
    name: Release image and Helm chart
    needs: [checks]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: debian-large
    timeout-minutes: 30
    steps:
      - name: Install Docker CLI
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3-yaml
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y --no-install-recommends docker-ce-cli
          docker info

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set image tags
        id: image
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'The Git tag must be a valid Docker image tag (for example, v0.1.2).' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*)?$ ]]; then
            echo 'The Git tag must be a Helm-compatible version, such as v0.1.2 or 0.1.2-rc.1 (without +build metadata).' >&2
            exit 1
          fi
          echo "name=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: https://github.com/Azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Package versioned Helm chart
        id: chart
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_dir="$(mktemp -d)"
          cp -R charts/forgejo-arc "$release_dir/forgejo-arc"
          export RELEASE_CHART_DIR="$release_dir/forgejo-arc"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          chart = Path(os.environ['RELEASE_CHART_DIR'])
          tag = os.environ['RELEASE_TAG']
          metadata = yaml.safe_load((chart / 'Chart.yaml').read_text())
          metadata['version'] = tag
          metadata['appVersion'] = tag
          (chart / 'Chart.yaml').write_text(yaml.safe_dump(metadata, sort_keys=False))
          values = yaml.safe_load((chart / 'values.yaml').read_text())
          values['image']['repository'] = os.environ['REGISTRY'] + '/' + os.environ['IMAGE_NAME']
          values['image']['tag'] = tag
          (chart / 'values.yaml').write_text(yaml.safe_dump(values, sort_keys=False))
          PY
          helm lint "$RELEASE_CHART_DIR"
          helm template forgejo-arc "$RELEASE_CHART_DIR" >/dev/null
          helm package "$RELEASE_CHART_DIR" --destination "$release_dir"
          echo "package=$release_dir/forgejo-arc-${RELEASE_TAG}.tgz" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3

      - name: Log in to Forgejo container registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and publish
        uses: https://github.com/docker/build-push-action@v6
        env:
          # Build-record uploads use GitHub's artifact API, unavailable on Forgejo.
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.title=forgejo-arc

      - name: Publish Helm chart
        shell: bash
        env:
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          CHART_PACKAGE: ${{ steps.chart.outputs.package }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" |
            helm registry login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
          helm push "$CHART_PACKAGE" "oci://${REGISTRY}/${CHART_REPOSITORY}"
